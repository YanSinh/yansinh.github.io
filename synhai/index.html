<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Synh AI — Khmer AI assistant">
  <title>Synh AI</title>
  <link rel="icon" href="https://yansinh.github.io/csm/img/sinh.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="sidebar-top">
        <a class="brand" href="#" aria-label="Synh AI home">
          <img src="synai.jpg" class="brand-mark"><i class="fa-solid fa-sparkles"></i></span>
          <span>Synh <b>AI</b></span>
        </a>
        <button class="icon-button mobile-close" id="close-sidebar" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <button class="new-chat-btn" id="new-chat-btn"><i class="fa-solid fa-plus"></i> <span id="new-chat-text">ជជែកថ្មី</span></button>
      <div class="history-heading">ការជជែកថ្មីៗ</div>
      <div class="chat-history" id="chat-history"></div>
      <div class="sidebar-bottom">
        <div class="profile-avatar"><img id="profile-avatar-img" alt="User avatar"></div>
        <div class="profile-copy"><strong>យ៉ាន ស៊ីញ</strong><span>Synh AI Assistant</span></div>
        <span class="online-dot" title="Ready"></span>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menu-toggle" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-title"><img src="synai.jpg" class="mini-mark"><i class="fa-solid fa-sparkles"></i></span><strong>Synh AI</strong><span class="topbar-subtitle">Khmer AI assistant</span></div>
        <div class="connection" id="connection-status"><span class="status-dot"></span><span id="status-text">Ready</span></div>
      </header>

      <section class="chat-layout">
        <div class="chat-window" id="chat-window" aria-live="polite">
          <section class="welcome-message" id="welcome-message">
            <div class="welcome-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <p class="eyebrow">WELCOME TO SYNH AI</p>
            <h1>សួស្តី! តើខ្ញុំអាចជួយអ្វីអ្នកបាន?</h1>
            <p class="welcome-description">សួរសំណួរ សរសេរ បកប្រែ ឬស្វែងយល់អំពីប្រធានបទថ្មីៗជាភាសាខ្មែរ។</p>
            <div class="features-grid">
              <button class="feature-card" data-prompt="ពន្យល់អំពីបញ្ញាសិប្បនិម្មិត (AI) ជាភាសាខ្មែរងាយយល់។"><span class="feature-icon blue"><i class="fa-regular fa-lightbulb"></i></span><strong>សំណួរទូទៅ</strong><small>ស្វែងយល់ពីប្រធានបទផ្សេងៗ</small></button>
              <button class="feature-card" data-prompt="ជួយសរសេរអត្ថបទខ្លីអំពីបច្ចេកវិទ្យា AI នៅកម្ពុជា។"><span class="feature-icon purple"><i class="fa-regular fa-pen-to-square"></i></span><strong>ជំនួយការសរសេរ</strong><small>សរសេរ និងកែសម្រួលអត្ថបទ</small></button>
              <button class="feature-card" data-prompt="បកប្រែឃ្លា 'Hello, how are you today?' ទៅជាភាសាខ្មែរ ហើយពន្យល់ពាក្យសំខាន់ៗ។"><span class="feature-icon green"><i class="fa-solid fa-language"></i></span><strong>ការបកប្រែ</strong><small>បកប្រែរវាងភាសាផ្សេងៗ</small></button>
              <button class="feature-card" data-prompt="បង្កើតផែនការរៀន JavaScript សម្រាប់អ្នកចាប់ផ្តើមរយៈពេល ៧ ថ្ងៃ។"><span class="feature-icon orange"><i class="fa-solid fa-graduation-cap"></i></span><strong>រៀនអ្វីថ្មី</strong><small>រៀនជាជំហានៗ</small></button>
            </div>
          </section>
          <div class="messages" id="messages"></div>
          <div class="typing-indicator" id="typing-indicator" hidden><span></span><span></span><span></span><small>Synh AI កំពុងគិត...</small></div>
        </div>

        <footer class="composer-wrap">
          <div class="attachment-preview" id="attachment-preview" hidden></div>
          <form class="composer" id="chat-form">
            <label class="attach-button" title="ភ្ជាប់ឯកសារ" aria-label="Attach file">
              <i class="fa-solid fa-paperclip"></i>
              <input type="file" id="file-input" accept="image/*,.txt,.md,.csv,.pdf,.doc,.docx">
            </label>
            <textarea id="message-input" rows="1" maxlength="12000" placeholder="សរសេរសាររបស់អ្នក..." aria-label="Message"></textarea>
            <button class="send-button" id="send-button" type="submit" aria-label="Send message"><i class="fa-solid fa-arrow-up"></i></button>
          </form>
          <div class="bottom-settings" aria-label="Display settings">
            <div class="setting-group">
              <span class="setting-label" data-i18n="appearance">រូបរាង</span>
              <button type="button" class="setting-button" id="theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-sun"></i><span id="theme-label">Light</span></button>
            </div>
            <div class="setting-group">
              <span class="setting-label" data-i18n="language">ភាសា</span>
              <div class="language-switch" role="group" aria-label="Language">
                <button type="button" class="language-button active" data-language="km">KH</button>
                <button type="button" class="language-button" data-language="en">EN</button>
              </div>
            </div>
          </div>
          <p class="composer-note" data-i18n="disclaimer">Synh AI អាចមានកំហុស។ សូមពិនិត្យព័ត៌មានសំខាន់ៗឡើងវិញ។</p>
        </footer>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
